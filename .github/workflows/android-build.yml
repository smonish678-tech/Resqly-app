name: Android Build (APK + AAB)

# Triggers:
#   - Manually via "Run workflow" (any branch)
#   - Automatically on every push to main
on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build signed release AAB (requires keystore secrets)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build Resqly Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Production backend URL baked into the APK at build time.
      # Override this in your repo by setting the variable in:
      #   Settings -> Secrets and variables -> Actions -> Variables -> REACT_APP_BACKEND_URL
      REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || 'https://resqly-launch.emergent.host' }}
      ENABLE_HEALTH_CHECK: "false"
      GENERATE_SOURCEMAP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web bundle (CRA / craco)
        run: CI=false yarn build

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # -----------------------------------------------------------------------
      # 1) DEBUG APK — always built. Sideload-able, NOT for the Play Store.
      # -----------------------------------------------------------------------
      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: resqly-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # -----------------------------------------------------------------------
      # 2) RELEASE AAB + APK — built only if keystore secrets are configured.
      #    Secrets required (Settings -> Secrets and variables -> Actions):
      #       RESQLY_KEYSTORE_BASE64    -> base64 of the .jks file
      #       RESQLY_KEYSTORE_PASSWORD  -> store password
      #       RESQLY_KEY_ALIAS          -> e.g. resqly-release
      #       RESQLY_KEY_PASSWORD       -> key password
      # -----------------------------------------------------------------------
      - name: Decode and validate signing keystore
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release == 'true' }}
        id: keystore
        env:
          KS_B64: ${{ secrets.RESQLY_KEYSTORE_BASE64 }}
          KS_STORE_PASSWORD: ${{ secrets.RESQLY_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RESQLY_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.RESQLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_STORE_PASSWORD" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_KEY_PASSWORD" ]; then
            echo "::error::Signed release requested, but one or more RESQLY signing secrets are missing."
            echo "Configure RESQLY_KEYSTORE_BASE64, RESQLY_KEYSTORE_PASSWORD, RESQLY_KEY_ALIAS, and RESQLY_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          KEYSTORE="${{ github.workspace }}/release-signing.jks"
          printf '%s' "$KS_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KS_STORE_PASSWORD" -alias "$KS_ALIAS" >/dev/null
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Signing keystore and alias validated."

      - name: Build Release AAB + APK
        if: steps.keystore.outputs.skip == 'false'
        working-directory: frontend/android
        env:
          RESQLY_KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks
          RESQLY_KEYSTORE_PASSWORD: ${{ secrets.RESQLY_KEYSTORE_PASSWORD }}
          RESQLY_KEY_ALIAS: ${{ secrets.RESQLY_KEY_ALIAS }}
          RESQLY_KEY_PASSWORD: ${{ secrets.RESQLY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Verify signed release APK and AAB
        if: steps.keystore.outputs.skip == 'false'
        working-directory: frontend/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"
          echo "Both release artifacts exist and their signing metadata verified."

      - name: Upload Release AAB (Play Store)
        if: steps.keystore.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: resqly-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release APK
        if: steps.keystore.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: resqly-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup keystore from workspace
        if: always() && steps.keystore.outputs.skip == 'false'
        run: rm -f "${{ github.workspace }}/release-signing.jks"
# trigger
